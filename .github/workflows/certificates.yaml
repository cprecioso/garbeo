on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

name: Certificates

# Shared with betas, so a beta never fetches a certificate mid-replacement
concurrency:
  group: "signing"
  cancel-in-progress: false

jobs:
  renew:
    runs-on: macos-26
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          working_directory: App

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Renew certificate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: mise run renew_certificate
