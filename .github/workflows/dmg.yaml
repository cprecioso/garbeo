on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false

name: Build DMG

jobs:
  build-dmg:
    runs-on: xcode-27

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - run: Scripts/build-dmg.sh
        env:
          MARKETING_VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: build/*.dmg
          if-no-files-found: error
