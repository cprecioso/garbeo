<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garbeo for Mac</title>
  <meta name="description" content="A native client for Paseo, the agentic development environment.">
  <link rel="icon" href="icon-Default.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icon-Dark.png" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #ff6d00;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { padding: 2rem; }
    img { width: 128px; height: 128px; }
    h1 { margin: 0.5rem 0 0.25rem; font-size: 2.5rem; }
    p { margin: 0.25rem 0; color: color-mix(in srgb, currentColor 60%, transparent); }
    .download {
      display: inline-block;
      margin: 1.5rem 0 0.75rem;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      text-decoration: none;
    }
    .download:hover { filter: brightness(1.1); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <picture>
      <source srcset="icon-Dark.png" media="(prefers-color-scheme: dark)">
      <img src="icon-Default.png" alt="">
    </picture>
    <h1>Garbeo</h1>
    <p>A native client for <a href="https://paseo.sh">Paseo</a>, the agentic development environment.</p>
    <a class="download" href="Garbeo.zip">Download for Mac</a>
    <p>Version {{VERSION}} (<a href="https://github.com/cprecioso/garbeo/commit/{{COMMIT}}">{{COMMIT}}</a>) · Requires macOS {{MINIMUM_SYSTEM_VERSION}} or later</p>
    <p><a href="https://github.com/cprecioso/garbeo">Source on GitHub</a></p>
  </main>
</body>
</html>
