redactions = ["FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD"]

[deps.bundler]
auto = true
sources = ["Gemfile", "Gemfile.lock", "fastlane/Pluginfile"]

[shell_alias]
fastlane = "bundle exec fastlane"

[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[tasks.build]
depends = ["build:mac", "build:ios"]

[tasks.beta]
depends = ["beta:mac", "beta:ios"]

[tasks.bump_build_number]
extends = "fastlane"
vars = { lane = "bump_build_number"}

[tasks."build:mac"]
extends = "fastlane"
vars = { lane = "mac build"}

[tasks."beta:mac"]
extends = "fastlane"
vars = { lane = "mac beta"}

[tasks."build:ios"]
extends = "fastlane"
vars = { lane = "ios build"}

[tasks."beta:ios"]
extends = "fastlane"
vars = { lane = "ios beta"}

[tasks."nightly:mac"]
extends = "fastlane"
vars = { lane = "mac nightly"}
